# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json
instances:
  - url: kite.docs.buildwithfern.com

title: Kite

logo:
  light: assets/icon.svg
  dark: assets/icon-dark.svg
favicon: assets/favicon.svg

colors:
  accent-primary:
    light: "#2f9bde"
    dark: "#2f9bde"
  background:
    light: "#ffffff"

navbar-links:
  - type: github
    value: https://github.com/Kite-01/server

theme:
  tabs:
    style: bubble
    placement: header

tabs:
  docs:
    display-name: Documentation
    icon: fa-regular fa-book
    skip-slug: true
  api:
    display-name: API Reference
    icon: fa-regular fa-code
    slug: api-reference

navigation:
  - tab: docs
    layout:
      - section: Getting started
        skip-slug: true
        contents:
          - page: Introduction
            icon: fa-regular fa-house
            path: pages/index.mdx
          - page: How Kite works
            icon: fa-regular fa-diagram-project
            path: pages/how-kite-works.mdx
          - page: Hosted Kite
            icon: fa-regular fa-cloud
            slug: hosted
            path: pages/hosted.mdx
      - section: Run a server
        slug: server
        contents:
          - page: Install
            icon: fa-regular fa-download
            path: pages/server/install.mdx
          - page: Configuration
            icon: fa-regular fa-sliders
            path: pages/server/configuration.mdx
          - page: First run
            icon: fa-regular fa-play
            path: pages/server/first-run.mdx
          - page: Providers
            icon: fa-regular fa-plug
            path: pages/server/providers.mdx
          - page: Chains and tokens
            icon: fa-regular fa-link
            path: pages/server/chains-and-tokens.mdx
          - page: Testnets
            icon: fa-regular fa-flask
            path: pages/server/testnets.mdx
          - page: Running in production
            icon: fa-regular fa-server
            slug: production
            path: pages/server/production.mdx
      - section: Payments
        contents:
          - page: Apps
            icon: fa-regular fa-grid-2
            path: pages/payments/apps.mdx
          - page: Payment links
            icon: fa-regular fa-file-invoice-dollar
            path: pages/payments/payment-links.mdx
          - page: Checkout
            icon: fa-regular fa-cart-shopping
            path: pages/payments/checkout.mdx
          - page: Transfers
            icon: fa-regular fa-arrow-right-arrow-left
            path: pages/payments/transfers.mdx
          - page: Payouts
            icon: fa-regular fa-money-bill-transfer
            path: pages/payments/payouts.mdx
          - page: Fees
            icon: fa-regular fa-percent
            path: pages/payments/fees.mdx
          - page: Refunds and recovery
            icon: fa-regular fa-rotate-left
            path: pages/payments/refunds-and-recovery.mdx
          - page: x402
            icon: fa-regular fa-robot
            slug: x402
            path: pages/payments/x402.mdx
      - section: Authentication
        contents:
          - page: Overview
            icon: fa-regular fa-shield-halved
            path: pages/authentication/overview.mdx
          - page: API keys
            icon: fa-regular fa-key
            path: pages/authentication/api-keys.mdx
          - page: Signing requests
            icon: fa-regular fa-signature
            path: pages/authentication/signing-requests.mdx
      - section: Integrate
        contents:
          - page: Taking payments from your app
            icon: fa-regular fa-puzzle-piece
            slug: overview
            path: pages/integrate/overview.mdx
          - page: "@kite-01/sdk"
            icon: fa-regular fa-cube
            slug: sdk
            path: pages/integrate/sdk.mdx
          - page: Webhooks
            icon: fa-regular fa-bell
            path: pages/integrate/webhooks.mdx
      - section: Contracts
        contents:
          - page: Overview
            icon: fa-regular fa-file-contract
            path: pages/contracts/overview.mdx
  - tab: api
    layout:
      - api: API Reference
        skip-slug: true
        summary: pages/api-reference.mdx
        specs:
          - type: openapi
            path: openapi/kite.json
